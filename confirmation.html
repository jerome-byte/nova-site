<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commande confirmée — NOVA</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="js/theme.js"></script>
</head>
<body>

<header class="entete">
  <div class="nav enveloppe">
    <a href="index.html" class="logo">NOVA<span>MODE &amp; TECH</span></a>
    <nav class="nav-liens">
      <a href="index.html">Boutique</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-actions">
      <form class="recherche-form" role="search" action="index.html" method="get" data-recherche>
        <input type="search" class="recherche-input" name="q" placeholder="Rechercher…" aria-label="Rechercher un produit" autocomplete="off">
      </form>
      <button type="button" class="bouton-theme" data-bascule-theme aria-label="Basculer le mode sombre / clair" title="Mode sombre / clair"><svg class="icone-lune" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icone-soleil" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <a href="favoris.html" class="lien-panier"><i class="fa-regular fa-heart"></i><span class="badge-panier badge-favoris" data-badge-favoris style="display:none;">0</span></a>
      <a href="panier.html" class="lien-panier"><i class="fa-solid fa-cart-shopping"></i><span class="badge-panier" data-badge-panier style="display:none;">0</span></a>
      <button type="button" class="bouton-menu" id="bouton-menu-ouvrir" aria-label="Ouvrir le menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<div class="confirmation" id="zone-confirmation"></div>

<script src="js/panier.js"></script>
<script src="js/boutique.js"></script>
<script src="js/effets.js"></script>
<script src="js/menu.js"></script>
<script>
  const brut = sessionStorage.getItem("nova_derniere_commande");
  const zone = document.getElementById("zone-confirmation");

  const methodes = {
    mobile: "Mobile Money",
    carte: "Carte bancaire",
    livraison: "Paiement à la livraison"
  };

  if (!brut) {
    zone.innerHTML = `
      <h1>Aucune commande trouvée</h1>
      <p>Il semble qu'aucune commande récente ne soit associée à cette session.</p>
      <a href="index.html" class="bouton bouton-primaire" style="margin-top:20px; display:inline-flex;">Retour à la boutique</a>`;
  } else {
    const commande = JSON.parse(brut);
    zone.innerHTML = `
      <div class="marque-ok">✓</div>
      <h1>Merci, ${commande.client.trim() || "votre commande a été reçue"} !</h1>
      <p>Votre commande a bien été enregistrée. Un e-mail de confirmation sera envoyé à ${commande.email}.</p>
      <div class="num-commande">Commande n° ${commande.numero}</div>
      <p>Montant total : <strong>${commande.total.toLocaleString("fr-FR")} FCFA</strong> — Paiement : ${methodes[commande.methode] || commande.methode}</p>
      <p style="margin-top:24px; font-size:0.85rem; color:var(--encre-doux);">Démonstration locale : aucune transaction réelle n'a été effectuée.</p>
      <a href="index.html" class="bouton bouton-primaire" style="margin-top:24px; display:inline-flex;">Continuer mes achats</a>`;
  }
</script>
</body>
</html>

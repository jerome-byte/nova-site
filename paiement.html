<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paiement — NOVA</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="js/theme.js"></script>
</head>
<body>

<header class="entete">
  <div class="nav enveloppe">
    <a href="index.html" class="logo">NOVA<span>MODE &amp; TECH</span></a>
    <nav class="nav-liens">
      <a href="index.html">Boutique</a>
      <a href="panier.html">Panier</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-actions">
      <form class="recherche-form" role="search" action="index.html" method="get" data-recherche>
        <input type="search" class="recherche-input" name="q" placeholder="Rechercher…" aria-label="Rechercher un produit" autocomplete="off">
      </form>
      <button type="button" class="bouton-theme" data-bascule-theme aria-label="Basculer le mode sombre / clair" title="Mode sombre / clair"><svg class="icone-lune" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icone-soleil" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <a href="favoris.html" class="lien-panier"><i class="fa-regular fa-heart"></i> <span class="badge-panier badge-favoris" data-badge-favoris style="display:none;">0</span></a>
      <a href="panier.html" class="lien-panier"><i class="fa-solid fa-cart-shopping"></i><span class="badge-panier" data-badge-panier style="display:none;">0</span></a>
      <button type="button" class="bouton-menu" id="bouton-menu-ouvrir" aria-label="Ouvrir le menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

<div class="page-titre enveloppe">
  <h1>Finaliser la commande</h1>
</div>

<div id="zone-paiement"></div>

<footer class="pied" style="margin-top:40px;">
  <div class="enveloppe pied-bas" style="border-top:none; padding-top:0;">
    <span>© 2026 NOVA. Tous droits réservés.</span>
    <span><a href="cgv.html" style="color:rgba(255,255,255,0.85);">Conditions générales de vente</a></span>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/icones.js"></script>
<script src="js/panier.js"></script>
<script src="js/boutique.js"></script>
<script src="js/effets.js"></script>
<script src="js/menu.js"></script>
<script>
  const lignes = lignesPanier();
  const conteneur = document.getElementById("zone-paiement");

  if (lignes.length === 0) {
    conteneur.innerHTML = `
      <div class="panier-vide enveloppe">
        <h2 class="serif" style="font-size:1.4rem;">Votre panier est vide</h2>
        <p>Ajoutez des produits avant de passer commande.</p>
        <a href="index.html" class="bouton bouton-primaire">Retour à la boutique</a>
      </div>`;
  } else {
    const sousTotal = sousTotalPanier();
    const livraison = fraisLivraison(sousTotal);
    const total = sousTotal + livraison;

    conteneur.innerHTML = `
      <form class="grille-paiement enveloppe" id="form-commande">
        <div>
          <div class="bloc-form">
            <h2>Coordonnées de livraison</h2>
            <div class="grille-champs">
              <div class="champ"><label for="prenom">Prénom</label><input id="prenom" required></div>
              <div class="champ"><label for="nom">Nom</label><input id="nom" required></div>
              <div class="champ pleine"><label for="email">E-mail</label><input id="email" type="email" required></div>
              <div class="champ pleine"><label for="telephone">Téléphone</label><input id="telephone" type="tel" required placeholder="+228 90 00 00 00"></div>
              <div class="champ pleine"><label for="adresse">Adresse</label><input id="adresse" required placeholder="Rue, quartier"></div>
              <div class="champ"><label for="ville">Ville</label><input id="ville" required value="Lomé"></div>
              <div class="champ"><label for="pays">Pays</label>
                <select id="pays">
                  <option>Togo</option><option>Bénin</option><option>Ghana</option><option>Côte d'Ivoire</option><option>Autre</option>
                </select>
              </div>
            </div>
          </div>

          <div class="bloc-form">
            <h2>Mode de paiement</h2>
            <div class="options-paiement" id="options-paiement">

              <label class="option-paiement selectionne">
                <input type="radio" name="paiement" value="mobile" checked>
                <div style="flex:1;">
                  <div class="option-paiement-titre">Mobile Money (Flooz / T-Money)</div>
                  <div class="option-paiement-desc">Paiement instantané depuis votre compte mobile.</div>
                  <div class="details-paiement visible" data-details="mobile">
                    <div class="champ"><label for="numero-mobile">Numéro Mobile Money</label><input id="numero-mobile" placeholder="+228 90 00 00 00"></div>
                  </div>
                </div>
              </label>

              <label class="option-paiement">
                <input type="radio" name="paiement" value="carte">
                <div style="flex:1;">
                  <div class="option-paiement-titre">Carte bancaire</div>
                  <div class="option-paiement-desc">Visa, Mastercard. Paiement sécurisé.</div>
                  <div class="details-paiement" data-details="carte">
                    <div class="grille-champs">
                      <div class="champ pleine"><label for="carte-numero">Numéro de carte</label><input id="carte-numero" placeholder="1234 1234 1234 1234"></div>
                      <div class="champ"><label for="carte-exp">Expiration</label><input id="carte-exp" placeholder="MM/AA"></div>
                      <div class="champ"><label for="carte-cvc">CVC</label><input id="carte-cvc" placeholder="123"></div>
                    </div>
                  </div>
                </div>
              </label>

              <label class="option-paiement">
                <input type="radio" name="paiement" value="livraison">
                <div style="flex:1;">
                  <div class="option-paiement-titre">Paiement à la livraison</div>
                  <div class="option-paiement-desc">Réglez en espèces à la réception du colis (zone de Lomé uniquement).</div>
                </div>
              </label>

            </div>
            <div class="bandeau-securite">
              🔒 Ceci est une démonstration : aucun paiement réel n'est traité. Pour un site en production, ce formulaire doit être relié à un prestataire de paiement certifié (ex. Stripe, PayGate, CinetPay) via un serveur sécurisé.
            </div>
          </div>
        </div>

        <aside class="recap">
          <h3>Votre commande</h3>
          <div>
            ${lignes.map(l => `
              <div class="mini-produit-recap">
                <div class="mini-visuel" style="background:${l.produit.couleurFond}">${iconeSVG(l.produit.icone, l.produit.couleur, l.produit.image)}</div>
                <div class="mini-produit-recap-info">
                  ${l.produit.nom}
                  ${l.taille ? `<div class="mini-produit-recap-qte">Taille ${l.taille} · ${l.couleur}</div>` : ""}
                  <div class="mini-produit-recap-qte">Qté ${l.quantite}</div>
                </div>
                <div>${formatPrix(l.produit.prix * l.quantite)}</div>
              </div>`).join("")}
          </div>
          <div class="recap-ligne"><span>Sous-total</span><span>${formatPrix(sousTotal)}</span></div>
          <div class="recap-ligne"><span>Livraison</span><span>${livraison === 0 ? "Offerte" : formatPrix(livraison)}</span></div>
          <div class="recap-ligne total"><span>Total</span><span>${formatPrix(total)}</span></div>
          <button type="submit" class="bouton bouton-primaire bouton-large" style="margin-top:20px;">Confirmer la commande</button>
          <p class="recap-note">En confirmant, vous acceptez nos <a href="cgv.html" style="text-decoration:underline;">conditions générales de vente</a>.</p>
        </aside>
      </form>`;

    conteneur.querySelectorAll('input[name="paiement"]').forEach(function(radio){
      radio.addEventListener("change", function(){
        conteneur.querySelectorAll(".option-paiement").forEach(o => o.classList.remove("selectionne"));
        conteneur.querySelectorAll(".details-paiement").forEach(d => d.classList.remove("visible"));
        radio.closest(".option-paiement").classList.add("selectionne");
        const details = conteneur.querySelector(`[data-details="${radio.value}"]`);
        if (details) details.classList.add("visible");
      });
    });

    document.getElementById("form-commande").addEventListener("submit", function(e){
      e.preventDefault();
      const numero = "NOVA-" + Math.floor(100000 + Math.random() * 900000);
      const commande = {
        numero: numero,
        client: document.getElementById("prenom").value + " " + document.getElementById("nom").value,
        email: document.getElementById("email").value,
        total: total,
        methode: document.querySelector('input[name="paiement"]:checked').value
      };
      sessionStorage.setItem("nova_derniere_commande", JSON.stringify(commande));
      viderPanier();
      window.location.href = "confirmation.html";
    });
  }
</script>
</body>
</html>
